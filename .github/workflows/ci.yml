name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y age
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          RW_AGE_BIN_DIRECTORY: /usr/bin
      - run: node scripts/agent-smoke.mjs
      - run: node scripts/action-consumer-local-smoke.mjs
      - name: Check committed Action bundle
        run: git diff --exit-code -- dist/action-bundle/index.js
      - name: Check npm package contents
        run: |
          pnpm --ignore-scripts pack --dry-run --json > "$RUNNER_TEMP/witness-pack.json"
          node scripts/check-package-contents.mjs "$RUNNER_TEMP/witness-pack.json"
      - name: Install the single package as a clean Linux consumer
        run: |
          mkdir -p "$RUNNER_TEMP/witness-package" "$RUNNER_TEMP/witness-consumer"
          pnpm --ignore-scripts pack --pack-destination "$RUNNER_TEMP/witness-package" > /dev/null
          package_version="$(node -p 'require("./package.json").version')"
          npm install --prefix "$RUNNER_TEMP/witness-consumer" --no-save --no-audit --no-fund \
            "$RUNNER_TEMP/witness-package/erol.senol-witness-ops-$package_version.tgz"
          witness="$RUNNER_TEMP/witness-consumer/node_modules/.bin/witness"
          test "$("$witness" --version)" = "$package_version"
          "$witness" deploy schema config-v2 > /dev/null
          "$witness" db --help > /dev/null

  action-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start disposable provider and runtime fixture
        id: fixture
        run: |
          node scripts/action-consumer-fixture.mjs "$RUNNER_TEMP" "$GITHUB_SHA" &
          echo "$!" > "$RUNNER_TEMP/action-fixture.pid"
          for attempt in {1..30}; do
            if [ -f "$RUNNER_TEMP/action-consumer.json" ]; then
              echo "config=$RUNNER_TEMP/action-consumer.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify deployed commit from clean Action consumer
        id: positive
        uses: ./
        with:
          config: ${{ steps.fixture.outputs.config }}
          expected-sha: ${{ github.sha }}
          coolify-token: fixture-token
      - name: Confirm positive decision
        env:
          ACTION_DECISION: ${{ steps.positive.outputs.decision }}
        run: test "$ACTION_DECISION" = PASS
      - name: Reject a wrong commit from clean Action consumer
        id: wrong-sha
        continue-on-error: true
        uses: ./
        with:
          config: ${{ steps.fixture.outputs.config }}
          expected-sha: 0123456789abcdef0123456789abcdef01234567
          coolify-token: fixture-token
          report-path: wrong-sha-report.json
      - name: Confirm wrong commit failed
        env:
          ACTION_OUTCOME: ${{ steps.wrong-sha.outcome }}
        run: test "$ACTION_OUTCOME" = failure
      - name: Run Action from clean checkout without installing dependencies
        id: witness
        continue-on-error: true
        uses: ./
        with:
          config: missing-consumer-config.yml
          expected-sha: 0123456789abcdef0123456789abcdef01234567
      - name: Confirm the Action rejected missing configuration
        env:
          ACTION_OUTCOME: ${{ steps.witness.outcome }}
        run: test "$ACTION_OUTCOME" = failure
      - name: Stop disposable fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/action-fixture.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/action-fixture.pid")" || true
          fi

  recovery-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres-major: [16, 17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install matching PostgreSQL client tools
        env:
          PG_MAJOR: ${{ matrix.postgres-major }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/witness-ops-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y "postgresql-client-$PG_MAJOR" age
      - run: docker pull postgres:${{ matrix.postgres-major }}
      - name: Start disposable S3-compatible storage
        run: |
          docker run -d --name witness-ci-s3 --memory 1g --cpus 1 -p 127.0.0.1:9000:9000 -v /data \
            -e RUSTFS_ACCESS_KEY=witness-ci-access -e RUSTFS_SECRET_KEY=witness-ci-secret \
            -e RUSTFS_CONSOLE_ENABLE=false -e RUSTFS_OBS_LOGGER_LEVEL=error \
            rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @erol.senol/restore-witness test:integration
        env:
          RW_AGE_BIN_DIRECTORY: /usr/bin
          RW_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          RW_TEST_S3_ACCESS: witness-ci-access
          RW_TEST_S3_SECRET: witness-ci-secret
          RW_TEST_MAJOR: ${{ matrix.postgres-major }}
          RW_POSTGRES_BIN_DIRECTORY: /usr/lib/postgresql/${{ matrix.postgres-major }}/bin
      - name: Remove disposable storage
        if: always()
        run: docker rm --force --volumes witness-ci-s3 || true

  desktop:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm make:desktop
      - name: Verify archive
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          archive="$(find apps/desktop/out/make/zip -name "WitnessOps-darwin-arm64-$package_version.zip" -type f -print -quit)"
          test -n "$archive"
          unzip -tq "$archive"
          unzip -Z1 "$archive" | grep -q 'WitnessOps.app/Contents/Resources/agent/bin/node$'
